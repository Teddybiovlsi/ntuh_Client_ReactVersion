# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ['main']

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets the GITHUB_TOKEN permissions to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      # secret 若未設定，產出的版本不會帶 Authorization header。
      # 這裡以警告呈現而非中斷部署：原本的 header 因格式錯誤極可能從未生效，
      # 擋下部署反而會讓原本可用的站台無法更新。
      - name: Check API credential secret
        env:
          VITE_API_BASIC_AUTH: ${{ secrets.VITE_API_BASIC_AUTH }}
        run: |
          if [ -z "$VITE_API_BASIC_AUTH" ]; then
            echo "::warning::未設定 secret VITE_API_BASIC_AUTH，本次部署不會送出 Authorization header。"
            echo "::warning::如需啟用，請至 Settings -> Secrets and variables -> Actions -> Repository secrets 新增，格式為 帳號:密碼（勿自行 base64）。"
          else
            case "$VITE_API_BASIC_AUTH" in
              *:*) echo "secret 檢查通過" ;;
              *) echo "::warning::VITE_API_BASIC_AUTH 格式可能有誤，應為 帳號:密碼" ;;
            esac
          fi
      - name: Build
        run: npm run build
        env:
          # 於 repo Settings -> Secrets and variables -> Actions 設定。
          # 注意：Vite 會把這些值內嵌進輸出的 JS，瀏覽器端仍可見，
          # 使用 secrets 只是避免值出現在原始碼與版本歷史中。
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_API_BASIC_AUTH: ${{ secrets.VITE_API_BASIC_AUTH }}
      # 回報憑證是否真的被編進 bundle。secret 為空時 Vite 會把該分支消除，
      # 建置仍會成功，因此檢查產物才能反映實際狀態。此步驟不阻擋部署。
      - name: Report auth header status
        env:
          VITE_API_BASIC_AUTH: ${{ secrets.VITE_API_BASIC_AUTH }}
        run: |
          if [ -n "$VITE_API_BASIC_AUTH" ] && grep -rqF "$VITE_API_BASIC_AUTH" dist/assets/*.js; then
            echo "✅ 憑證已編入產物，Authorization header 會正常送出"
          else
            echo "::warning::本次產物不含 API 憑證，Authorization header 不會送出。"
            echo "::warning::若後端需要驗證，請設定 secret VITE_API_BASIC_AUTH 後重跑此 workflow。"
          fi
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          # Upload dist repository
          path: './dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4